---
services:
  vault-unseal:
    image: docker.io/hashicorp/vault-enterprise:1.19-ent
    environment:
      VAULT_LICENSE: ${VAULT_LICENSE}
      # VAULT_DEV_ROOT_TOKEN_ID: root
      # VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      # VAULT_LOCAL_CONFIG: |
      #   {
      #     "disable_mlock": true,
      #     "storage": {
      #       "raft": {
      #         "path": "/vault/file"
      #       }
      #     },
      #     "api_addr": "http://127.0.0.1:8200",
      #     "cluster_addr": "https://127.0.0.1:8201",
      #     "default_lease_ttl": "168h",
      #     "max_lease_ttl": "720h",
      #     "ui": true
      #   }
    cap_add:
      - IPC_LOCK
    ports:
      - "8300:8300"
    volumes:
      - ./vault-alt-config:/vault/config:ro
      - ./vault-alt-data:/vault/file
    restart: always
    entrypoint: vault server -config=/vault/config

  vault:
    image: docker.io/thelonelyghost/vault-enterprise:1.19-ent
    environment:
      VAULT_LICENSE: ${VAULT_LICENSE}
      PKCS11_PROXY_SOCKET: tls://softhsm-server:2345
      PKCS11_PROXY_TLS_PSK_FILE: /opt/test.tls.psk
      # VAULT_DEV_ROOT_TOKEN_ID: root
      # VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      # VAULT_LOCAL_CONFIG: |
      #   {
      #     "disable_mlock": true,
      #     "storage": {
      #       "raft": {
      #         "path": "/vault/file"
      #       }
      #     },
      #     "api_addr": "http://127.0.0.1:8200",
      #     "cluster_addr": "https://127.0.0.1:8201",
      #     "default_lease_ttl": "168h",
      #     "max_lease_ttl": "720h",
      #     "ui": true
      #   }
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    volumes:
      - ./vault-config:/vault/config:ro
      - ./vault-data:/vault/file
      - ./plugins:/vault/plugins
      - ./logs:/var/log/vault:rw
    restart: always
    entrypoint: vault server -config=/vault/config/
    depends_on:
      - softhsm-server
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s

  softhsm-server:
    image: docker.io/vegardit/softhsm2-pkcs11-proxy:latest-alpine
    environment:
      TOKEN_IMPORT_TEST_DATA: '0'
    ports:
      - "2345:2345"
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
